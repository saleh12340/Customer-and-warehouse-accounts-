name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate WebView screens and scripts
        shell: bash
        run: |
          node --check app/src/main/assets/www/app.js
          node --check app/src/main/assets/www/customer-operation.js
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('app/src/main/assets/www/index.html', 'utf8');
          const scripts = [
            fs.readFileSync('app/src/main/assets/www/app.js', 'utf8'),
            fs.readFileSync('app/src/main/assets/www/customer-operation.js', 'utf8')
          ].join('');
          const ids = [...html.matchAll(/id=["']([^"']+)["']/g)].map(match => match[1]);
          const duplicates = ids.filter((id, index) => ids.indexOf(id) !== index);
          if (duplicates.length) throw new Error('Duplicate HTML ids: ' + [...new Set(duplicates)].join(', '));
          const functions = new Set([...scripts.matchAll(/function[ \t\r\n]+([A-Za-z_$][A-Za-z0-9_$]*)[ \t\r\n]*\(/g)].map(match => match[1]));
          const allowed = new Set(['if', 'event', 'window', 'Math', 'parseInt', 'parseFloat', 'Number', 'String', 'Boolean', 'Date', 'JSON', 'confirm', 'alert', 'setTimeout', 'clearTimeout']);
          const handlers = [...html.matchAll(/on(?:click|change|input|submit|keydown|keyup|focus|blur)=["']([^"']+)["']/g)].map(match => match[1]);
          const missing = new Set();
          for (const handler of handlers) {
            for (const call of handler.matchAll(/([A-Za-z_$][A-Za-z0-9_$]*)[ \t\r\n]*\(/g)) {
              if (!functions.has(call[1]) && !allowed.has(call[1])) missing.add(call[1]);
            }
          }
          if (missing.size) throw new Error('Undefined screen handlers: ' + [...missing].join(', '));
          for (const requiredId of ['inventory-quick-name', 'inventory-quick-qty', 'inventory-quick-buy', 'inventory-quick-sell', 'inventory-quick-unit', 'inventory-quick-carton-name', 'inventory-quick-carton-packs']) {
            if (!ids.includes(requiredId)) throw new Error('Missing quick inventory field: ' + requiredId);
          }
          console.log('WebView JavaScript syntax, HTML ids, and inline handlers validated.');
          NODE

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      # Reuse the same non-production debug signing key between CI runs so
      # successive debug APKs remain installable as updates to one another.
      - name: Restore stable debug keystore
        uses: actions/cache@v4
        with:
          path: debug.keystore
          key: customer-warehouse-debug-keystore-v1-${{ github.repository }}

      - name: Create debug keystore when cache is empty
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          else
            echo "Using cached stable debug keystore"
          fi

      - name: Run unit tests and build Debug APK
        run: gradle testDebugUnitTest assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: customer-warehouse-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
